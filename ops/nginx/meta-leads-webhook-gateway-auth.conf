# Include in the autenticacion.clinicaclick.com HTTPS server. Its existing
# generic gateway location does not add the app/CRM forwarded-IP headers.
location ~ ^/api/(?:intake/)?leads/webhook/?$ {
    include /etc/nginx/snippets/clinicaclick-meta-leads-common.conf;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}
