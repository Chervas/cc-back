# Bootstrap-only vhost for the first ACME certificate. Install this file before
# the TLS vhost exists, point DNS at the origin, issue the certificate with the
# webroot below, and then replace it with sites.clinicaclick.com.conf.
#
# It deliberately serves no landing content: a channel must never appear live
# before TLS, backend flags and the public end-to-end checks are complete.

server {
    listen 80;
    listen [::]:80;
    server_name sites.clinicaclick.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
