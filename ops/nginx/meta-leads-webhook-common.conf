# Include only inside the dedicated Meta Lead callback location.
access_log /var/log/nginx/meta-leads-access.log clinicaclick_meta_leads_safe;
# Upstream and parser errors can otherwise record the full verification URI.
error_log /dev/null crit;
client_max_body_size 64k;
client_body_buffer_size 64k;
client_body_in_file_only off;
client_body_in_single_buffer on;
client_body_timeout 10s;
if ($http_content_encoding !~* "^(identity)?$") { return 415; }
limit_except GET POST { deny all; }
proxy_request_buffering off;
proxy_buffering off;
proxy_cache off;
proxy_next_upstream off;
proxy_read_timeout 35s;
proxy_send_timeout 15s;
send_timeout 15s;
