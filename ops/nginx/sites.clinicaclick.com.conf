# Managed origin for Clinicaclick-hosted pages. Install only after the backend
# feature gates and TLS certificate are ready. The backend resolves immutable
# signed artifacts by Host/path and exposes only the two same-origin POST bridges
# compiled into hosted pages.

include /etc/nginx/snippets/clinicaclick-cloudflare-real-ip.conf;

server {
    listen 80;
    listen [::]:80;
    server_name sites.clinicaclick.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sites.clinicaclick.com;

    ssl_certificate /etc/letsencrypt/live/sites.clinicaclick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sites.clinicaclick.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # `$remote_addr` is restored from CF-Connecting-IP only when the direct
    # peer belongs to an allowlisted Cloudflare range. Replacing (rather than
    # appending) X-Forwarded-For prevents a visitor-supplied chain reaching
    # Express. Express trusts only this loopback Nginx hop.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Set-Cookie;

    location ^~ /api/ {
        return 404;
    }

    location = /_clinicaclick/intake {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /_clinicaclick/events {
        limit_except POST { deny all; }
        # The backend validates a canonical event payload of up to 64 KiB. The
        # small margin covers the signed same-origin wrapper around that payload.
        client_max_body_size 80k;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 30s;
    }
}
